# ==============================================================================
# HOMEHUB PLATFORM — AUTHORITATIVE GOOGLE CLOUD BUILD PIPELINE
# Region: europe-west3
# Target Registry: europe-west3-docker.pkg.dev/$PROJECT_ID/homehub-registry/homehub-platform
# ==============================================================================

steps:
  # 1. Build the production multi-stage container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/$PROJECT_ID/homehub-registry/homehub-platform:$BUILD_ID'
      - '-t'
      - 'europe-west3-docker.pkg.dev/$PROJECT_ID/homehub-registry/homehub-platform:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    id: 'build-image'

  # 2. Push to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'europe-west3-docker.pkg.dev/$PROJECT_ID/homehub-registry/homehub-platform'
    id: 'push-image'

images:
  - 'europe-west3-docker.pkg.dev/$PROJECT_ID/homehub-registry/homehub-platform:$BUILD_ID'
  - 'europe-west3-docker.pkg.dev/$PROJECT_ID/homehub-registry/homehub-platform:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

substitutions:
  _REGION: 'europe-west3'

timeout: '1200s'
